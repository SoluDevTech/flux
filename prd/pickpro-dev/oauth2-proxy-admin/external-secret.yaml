apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oauth2-proxy-admin-external-secret
  namespace: pickpro-dev
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: oauth2-proxy-admin-secret
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: pickpro-dev/admin-oauth2-proxy
