apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickpro-admin
  namespace: pickpro-dev
  labels:
    app: pickpro-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickpro-admin
  template:
    metadata:
      labels:
        app: pickpro-admin
        app.kubernetes.io/part-of: soludev-workload
    spec:
      containers:
        - name: pickpro-admin
          # Image de bootstrap manuel : poussée à la main, remplacée par le
          # CD du repo pickpro-admin (base dev) au premier PR merged.
          image: kaiohz/pickpro:pickpro-admin-manual-bootstrap
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "192Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: pickpro-admin-config
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      imagePullSecrets:
        - name: pickpro-docker-secret
