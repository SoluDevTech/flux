# RustFS PickPro DEV — identifiants root (creds dédiés pickpro-dev-rustfs)
# OpenBao path: pickpro-dev/rustfs (clés RUSTFS_ACCESS / RUSTFS_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-external-secret
  namespace: pickpro-dev
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-pickpro-dev
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: pickpro-dev/rustfs