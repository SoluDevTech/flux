# API joignable sur l'origine du front DEV (https://pickpro.soludev.tech/
# pickpro/rest/…) — design same-origin des presigned URLs 302 (miroir de
# pickpro/pickpro-api/ingress-web.yaml). Mêmes middlewares que l'ingress
# pickpro-api.soludev.tech (cors + forward-auth) ; les skip_auth_routes
# d'oauth2-proxy (^/pickpro/rest/v1/verify-invite, set-password-public,
# webhooks) matchent le X-Forwarded-Uri → endpoints publics d'invitation
# préservés.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pickpro-api-web-ingress
  namespace: pickpro-dev
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pickpro-dev-cors-middleware@kubernetescrd,pickpro-dev-traefik-forward-auth@kubernetescrd
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-scheme: https
spec:
  rules:
    - host: pickpro.soludev.tech
      http:
        paths:
          - path: /pickpro
            pathType: Prefix
            backend:
              service:
                name: pickpro-api
                port:
                  number: 8000
