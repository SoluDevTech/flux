apiVersion: v1
kind: ConfigMap
metadata:
  name: pickpro-api-config
  namespace: pickpro-dev
data:
  ALLOWED_ORIGINS: '["https://pickpro.soludev.tech"]'
  DEV_MODE: "true"
  CHAT_MODEL: z-ai/glm-5.3-flash:nitro
  TITLE_MODEL: z-ai/glm-5.3-flash:nitro
  TITLE_REASONING_EFFORT: low
  EXTRACT_MODEL: z-ai/glm-5.3-flash:nitro
  EXTRACT_REASONING_EFFORT: low
  GRADER_MODEL: z-ai/glm-5.3-flash:nitro
  GRADER_REASONING_EFFORT: low
  JOB_STRUCTURE_MODEL: z-ai/glm-5.3-flash:nitro
  JOB_STRUCTURE_REASONING_EFFORT: low
  PROJECT_SUMMARY_REASONING_EFFORT: low
  STUDIO_MODEL: z-ai/glm-5.3-flash:nitro
  STUDIO_REASONING_EFFORT: "high"
  DEEP_AGENT_MODEL: z-ai/glm-5.3-flash:nitro
  DEEP_AGENT_MAX_TOKENS: "16384"
  DEEP_AGENT_REASONING_EFFORT: high
  DEEP_AGENT_MAX_INPUT_TOKENS: "1310720"
  DEEP_AGENT_RECURSION_LIMIT: "150"
  DEEP_AGENT_SQL_BUDGET: "25"
  DEEP_AGENT_JOB_STRUCTURE_CACHE_MAX: "32"
  DEEP_AGENT_PUBLISH_VALIDATION_MAX_RETRIES: "2"
  # SQL_DEBUG active l echo SQLAlchemy (chaque statement loggue) — utile
  # ponctuellement pour debugger, desactive par defaut car il ajoute des
  # centaines de ms par requete + alimente openobserve en continu.
  SQL_DEBUG: "False"
  # Search deep agent (issue #305 stream feature): REQUIRED env (the API
  # refuses to start without it) — same model family as the chat deep agent.
  SEARCH_AGENT_MODEL: z-ai/glm-5.3-flash:nitro
  SEARCH_AGENT_REASONING_EFFORT: low
  OPEN_ROUTER_API_URL: https://openrouter.ai/api/v1
  PHOENIX_HOST: http://phoenix-svc.soludev.svc.cluster.local:6006
  MINIO_HOST: rustfs-pickpro-dev-svc.pickpro-dev.svc.cluster.local:9000
  MINIO_ACCESS: pickpro-dev-rustfs
  MINIO_BUCKET: cvs
  MINIO_ALLOWED_EXTENSION: .pdf
  INDEXING_API_URL: http://pickpro-indexing-api.pickpro-dev.svc.cluster.local:8000/pickpro/rest/v1
  INDEXING_API_TIMEOUT: "120"
  LOGTO_URL: http://logto.soludev.svc.cluster.local:3001
  LOGTO_GOOGLE_CONNECTOR_ID: 3zk5bznj8tavejeddtlse
  LOGTO_M2M_APP_ID: pickpro-dev-m2m
  RECALL_AI_REGION: eu-central-1
  RECALL_AI_BOT_NAME: PickPro-Dev
  JWT_AUDIENCE: pickpro-dev
  ENVIRONMENT: "development"
  ALLOWED_REDIRECT_URIS: '["https://pickpro.soludev.tech"]'
  DOMAIN: pickpro.soludev.tech
  PROTOCOL: https
  OAUTH2_PROXY_URL: https://pickpro.soludev.tech
  PICKPRO_ORGANIZATION_ID: m9qqyvmp8xyc
  SMTP_HOST: smtp.gmail.com
  SMTP_PORT: "587"
  SMTP_USERNAME: soludevtech@gmail.com
  SMTP_FROM: soludevtech@gmail.com
  SMTP_SECURE: "true"
  APP_BASE_URL: https://pickpro.soludev.tech
  NATS_USER: "pickpro"
  NATS_URL: "nats://nats.soludev.svc.cluster.local:4222"
  NATS_STREAM_NAME: "RESUMES-DEV"
  NATS_STREAM_SUBJECT: "mass-import-dev"
  NATS_MAX_PAYLOAD: "15728640"
  NATS_MAX_AGE: "604800"
