# MinIO PickPro DEV — stockage local sur Storage30
# Data: /srv/nfs/pickpro-dev/minio
# Secret: pickpro-dev/minio (openbao)
# Install helm manuel : helm upgrade --install minio-pickpro-dev minio/minio -n pickpro-dev -f config/prd/minio/pickpro/values.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pickpro-dev-minio
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pickpro-dev-minio
  local:
    path: /srv/nfs/pickpro-dev/minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - storage30
