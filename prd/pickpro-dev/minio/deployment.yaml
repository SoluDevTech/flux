# MinIO PickPro DEV — stockage local sur Storage30
# Data: /srv/nfs/pickpro-dev/minio
# Secret: pickpro-dev/minio (openbao)
# PV/PVC dans prd/pickpro-dev/minio/minio.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio-pickpro-dev
  namespace: pickpro-dev
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        app.kubernetes.io/part-of: soludev-workload
    spec:
      nodeSelector:
        storage/nodename: storage30
      tolerations:
        - key: storage/role
          operator: Equal
          value: data
          effect: NoSchedule
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
          command:
            - "/bin/sh"
            - "-ce"
            - "/usr/bin/docker-entrypoint.sh minio server /export -S /etc/minio/certs/ --address :9000 --console-address :9001"
          env:
            - name: MINIO_IAM_REFRESH
              value: "3600"
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-pickpro
                  key: rootUser
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-pickpro
                  key: rootPassword
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9001
              name: http-console
          volumeMounts:
            - name: data
              mountPath: /export
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: minio-pickpro-dev
  namespace: pickpro-dev
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: minio-pickpro-dev-console
  namespace: pickpro-dev
  labels:
    app: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: http-console
      port: 9001
      targetPort: 9001
      protocol: TCP
