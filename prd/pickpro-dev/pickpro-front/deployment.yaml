apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickpro-front
  namespace: pickpro-dev
  labels:
    app: pickpro-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickpro-front
  template:
    metadata:
      labels:
        app: pickpro-front
        app.kubernetes.io/part-of: soludev-workload
    spec:
      containers:
        - name: pickpro-front
          image: kaiohz/pickpro:pickpro-front-ef91dab00ccc3a4b88ca04c8bfc7f31a283ef0eb
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "192Mi"
              cpu: "500m"
      volumes:
        - name: config-volume
          configMap:
            name: pickpro-front-config
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      imagePullSecrets:
        - name: pickpro-docker-secret