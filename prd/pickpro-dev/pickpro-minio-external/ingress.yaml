# Routage same-origin des médias DEV (miroir de pickpro/pickpro-minio-external)
# — l'API répond 302 vers https://pickpro.soludev.tech/photos|/cvs/{bucket}/{key}
# ?signature, routé ici vers le MinIO dev externe (docker :9031). La
# spécificité des paths bat le Prefix / du front ingress.
#
# ⚠️ AUCUN middleware (ni forward-auth, ni cors) : la signature SigV4 est
# l'authentification ; Host préservé par Traefik (la signature SigV4 couvre
# le Host) ; requêtes non signées → 403 MinIO.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pickpro-media-ingress
  namespace: pickpro-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-scheme: https
spec:
  rules:
    - host: pickpro.soludev.tech
      http:
        paths:
          - path: /photos
            pathType: Prefix
            backend:
              service:
                name: pickpro-minio-external
                port:
                  number: 9031
          - path: /cvs
            pathType: Prefix
            backend:
              service:
                name: pickpro-minio-external
                port:
                  number: 9031
