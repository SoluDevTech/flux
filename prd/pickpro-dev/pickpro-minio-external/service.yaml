# MinIO pickpro-dev est déployé HORS cluster (docker sur le VPS storage30,
# IP Tailscale 100.64.0.7, port 9031) — voir
# infra-vps/storage30/docker-compose.yml (minio-pickpro-dev).
# Miroir dev de pickpro/pickpro-minio-external : même design same-origin des
# presigned URLs 302 (spec feat-presigned-media) — le navigateur suit la 302
# de l'API vers https://pickpro.soludev.tech/photos|/cvs, routé ici sans
# middleware (la signature SigV4 EST l'authentification).
apiVersion: v1
kind: Service
metadata:
  name: pickpro-minio-external
  namespace: pickpro-dev
spec:
  clusterIP: None
  ports:
    - port: 9031
      targetPort: 9031
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pickpro-minio-external
  namespace: pickpro-dev
subsets:
  - addresses:
      - ip: 100.64.0.7
    ports:
      - port: 9031
