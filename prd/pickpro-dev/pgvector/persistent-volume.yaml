apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-pickpro-dev-pgvector
  namespace: pickpro-dev
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-pickpro-dev-pgvector
  nfs:
    server: 100.64.0.7
    path: /srv/nfs/pickpro-dev/pgvector
  mountOptions:
    - hard
    - nfsvers=4
    - timeo=300
    - retrans=10
    - rsize=1048576
    - wsize=1048576
    - noatime
    - nodiratime