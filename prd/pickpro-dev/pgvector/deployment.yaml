# PGVector PickPro DEV — stockage local sur Storage30
# Data: /srv/nfs/pickpro-dev/pgvector
# Secret: pickpro-dev/pgvector (openbao)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: pickpro-dev
  labels:
    app: pgvector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
        app.kubernetes.io/part-of: soludev-workload
    spec:
      # Repo Docker Hub kaiohz/pickpro privé : pull secret (meme secret que
      # les deployments composables / pickpro, sync depuis OpenBao)
      imagePullSecrets:
        - name: pickpro-docker-secret
      nodeSelector:
        storage/nodename: storage30
      tolerations:
        - key: storage/role
          operator: Equal
          value: data
          effect: NoSchedule
      volumes:
        - name: init-sql
          configMap:
            name: pgvector-init
        - name: pgvector-data
          persistentVolumeClaim:
            claimName: pickpro-dev-pgvector-pvc
      containers:
        - name: pgvector
          # Image RAG (postgres 17 + extensions age / pg_textsearch / vector) :
          # instance mutualisee pickpro-dev + composables depuis nov 2026 —
          # la base raganything (RAG) y a ete restauree, pickpro ne change pas.
          image: kaiohz/pickpro:postgres-raganything-e6cb6a51abeeba1133a05af6f1a2616bfbf9aa0c
          # Repo Docker Hub kaiohz/pickpro PRIVE -> pull secret requis
          imagePullPolicy: Always
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=512MB"
            - "-c"
            - "work_mem=8MB"
            - "-c"
            - "effective_cache_size=1536MB"
            - "-c"
            - "jit=off"
            - "-c"
            - "log_min_duration_statement=0"
            - "-c"
            - "tcp_keepalives_idle=30"
            - "-c"
            - "tcp_keepalives_interval=10"
            - "-c"
            - "tcp_keepalives_count=6"
            - "-c"
            - "idle_in_transaction_session_timeout=60000"
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: pgvector-secret
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
            - name: pgvector-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            tcpSocket:
              port: 5432
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - pg_isready
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "3Gi"
              cpu: "2000m"
