# Valkey (pickpro-dev) — cache for pickpro-dev api/indexing/notifications
# + session store for the pickpro-dev oauth2-proxy.
# Migrated from the shared docker instance (Storage VPS 30,
# bind Tailscale 100.64.0.7:6379) into k8s. Dedicated instance so a dev
# FLUSHALL cannot bleed into pickpro prod. Ephemeral: no PV, no RDB/AOF.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: pickpro-dev
  labels:
    app: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
        app.kubernetes.io/part-of: soludev-workload
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.1.12
          args:
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - name: valkey
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "256Mi"
              cpu: "500m"
      dnsConfig:
        options:
          - name: ndots
            value: "1"
