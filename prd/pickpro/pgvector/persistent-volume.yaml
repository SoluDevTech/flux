# PGVector PickPro PROD — stockage local sur Storage30
# Data: /srv/nfs/pickpro/pgvector
# Secret: pickpro/pgvector (openbao)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pickpro-pgvector
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pickpro-pgvector
  local:
    path: /srv/nfs/pickpro/pgvector
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - storage30
