# PGVector PickPro PROD v2 — stockage local sur pg-pickpro (Cloud VPS Plus 6)
# Data: /srv/nfs/pickpro/pgvector (node vmi3794476, 100.64.0.8, 300 GB NVMe)
# Migration nov 2026 : separation DB (pg-pickpro) / S3 (storage30-b).
# La v1 (local-pickpro-pgvector, storage30) reste en Retain pour rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pickpro-pgvector-v2
spec:
  capacity:
    storage: 20Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pickpro-pgvector-v2
  local:
    path: /srv/nfs/pickpro/pgvector
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - pg-pickpro
