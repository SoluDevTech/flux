# PGVector PickPro PROD — stockage local sur pg-pickpro (Cloud VPS Plus 6,
# node dedie 6 vCPU / 12 GB / 300 GB NVMe, fio 75k IOPS 4K)
# Data: /srv/nfs/pickpro/pgvector (PV v2 local-pickpro-pgvector-v2)
# Secret: pickpro/pgvector (openbao)
# Budget 80/20 : limits 9Gi/4800m sur 12 GB (20 % reserve au systeme).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgvector
  namespace: pickpro
  labels:
    app: pgvector
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
        app.kubernetes.io/part-of: soludev-workload
    spec:
      nodeSelector:
        storage/nodename: pg-pickpro
      tolerations:
        - key: storage/role
          operator: Equal
          value: data
          effect: NoSchedule
      volumes:
        - name: init-sql
          configMap:
            name: pgvector-init
        - name: pgvector-data
          persistentVolumeClaim:
            claimName: pickpro-pgvector-pvc-v2
      containers:
        - name: pgvector
          image: pgvector/pgvector:0.8.0-pg17
          args:
            - "postgres"
            - "-c"
            - "shared_buffers=2GB"
            - "-c"
            - "effective_cache_size=6GB"
            - "-c"
            - "maintenance_work_mem=1GB"
            - "-c"
            - "tcp_keepalives_idle=30"
            - "-c"
            - "tcp_keepalives_interval=10"
            - "-c"
            - "tcp_keepalives_count=6"
            - "-c"
            - "idle_in_transaction_session_timeout=60000"
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: pgvector-secret
          volumeMounts:
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d/init.sql
              subPath: init.sql
            - name: pgvector-data
              mountPath: /var/lib/postgresql/data
          startupProbe:
            tcpSocket:
              port: 5432
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "9Gi"
              cpu: "4800m"
