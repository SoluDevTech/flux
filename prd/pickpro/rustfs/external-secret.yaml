# RustFS PickPro PROD — identifiants root (creds dédiés pickpro-rustfs)
# OpenBao path: pickpro/rustfs (clés RUSTFS_ACCESS / RUSTFS_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-external-secret
  namespace: pickpro
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-pickpro
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: pickpro/rustfs