apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth2-proxy-config
  namespace: pickpro
data:
  oauth2_proxy.cfg: |
    redirect_url = "https://app.pickpro.io/oauth2/callback"

    cookie_domains = [".pickpro.io", ".soludev.tech"]
    whitelist_domains = [".pickpro.io", ".soludev.tech"]

    cookie_name = "oauth2-proxy-pickpro"
    email_domains = ["*"]

    reverse_proxy = true

    cookie_secure = true
    cookie_httponly = true
    cookie_path = "/"
    cookie_samesite = "lax"
    # TTL access token Logto = 1h (défaut OIDC) : oauth2-proxy ne
    # rafraichit le token qu'a cookie_refresh — au-dela, le token
    # transmis en X-Auth-Request-Access-Token est EXPIRE => 401 sur
    # /api/verifications/social + /api/my-account (connect Google
    # Calendar). 50m = refresh juste avant l'expiration du token.
    #
    # Arbitrage: a chaque refresh, contention du lock Redis de la
    # session (stored_session) ~1-2.5s pour les requetes concurrentes
    # du meme user sur /oauth2/auth (stalls en rafale). Un refresh
    # toutes les 50min reste preferable a un calendrier mort 3h/4h.
    cookie_refresh = "50m"
    cookie_csrf_per_request = true
    cookie_csrf_expire = "15m"

    skip_provider_button = true
    silence_ping_logging = true

    skip_auth_routes = [
      "^/auth/invite",
      "^/assets/",
      "^/config\\.json",
      "^/pickpro/rest/v1/verify-invite",
      "^/pickpro/rest/v1/set-password-public",
      "^/pickpro/rest/v1/webhooks",
    ]