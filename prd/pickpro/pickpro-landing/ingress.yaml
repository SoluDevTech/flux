apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pickpro-landing-ingress
  namespace: pickpro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-scheme: https
spec:
  rules:
    - host: pickorp.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pickpro-landing
                port:
                  number: 80
    - host: www.pickorp.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pickpro-landing
                port:
                  number: 80