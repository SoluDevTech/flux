apiVersion: apps/v1
kind: Deployment
metadata:
  name: pickpro-landing
  namespace: pickpro
  labels:
    app: pickpro-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pickpro-landing
  template:
    metadata:
      labels:
        app: pickpro-landing
        app.kubernetes.io/part-of: soludev-workload
    spec:
      tolerations:
        - key: "klipperlb-exclude"
          value: "true"
          effect: "NoSchedule"
          operator: "Equal"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/part-of: soludev-workload
      containers:
        - name: pickpro-landing
          image: kaiohz/pickpro:pickpro-landing-7702375baac0d37f8d010e29b39c3d64d803ae37
          ports:
            - containerPort: 80
          volumeMounts:
            - name: config-volume
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "96Mi"
              cpu: "100m"
      # Runtime config pour /config.json (openobserve RUM + hubspot forms).
      # Le code applicatif doit contenir le fallback config.json committé.
      volumes:
        - name: config-volume
          configMap:
            name: pickpro-landing-config
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      imagePullSecrets:
        - name: pickpro-docker-secret