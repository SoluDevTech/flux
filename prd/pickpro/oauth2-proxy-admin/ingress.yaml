apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth2-proxy-admin-ingress
  namespace: pickpro
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/redirect-scheme: https
    traefik.ingress.kubernetes.io/router.middlewares: pickpro-security-headers@kubernetescrd
spec:
  rules:
  - host: admin.pickpro.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy-admin-service
            port:
              number: 4180
  - host: admin.pickpro.soludev.tech
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oauth2-proxy-admin-service
            port:
              number: 4180
