# MinIO PickPro PROD — stockage local sur Storage30
# Data: /srv/nfs/pickpro/minio
# Install helm manuel : helm upgrade --install minio-pickpro minio/minio -n pickpro -f config/prd/minio/pickpro/values.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-pickpro-minio
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-pickpro-minio
  local:
    path: /srv/nfs/pickpro/minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - storage30
