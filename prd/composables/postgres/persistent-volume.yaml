# PostgreSQL RAG (pgvector) de Composables — stockage local direct sur Storage30 (déplacé du NFS)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-composables-postgres
  annotations:
    description: "Stockage local Storage30 — PostgreSQL pgvector composables (/srv/nfs/composables/postgres)"
spec:
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-composables-postgresql
  local:
    path: /srv/nfs/composables/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - storage30
