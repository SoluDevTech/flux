apiVersion: v1
kind: ConfigMap
metadata:
  name: composable-agents-config
  namespace: composables
data:
  # === OpenAI-compatible endpoint (OpenRouter, LiteLLM, etc.) ===
  OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
  # === Agent configuration ===
  AGENTS_DIR: "./agents"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  ALLOWED_ORIGINS: '["https://composables.soludev.tech"]'
  # === RustFS (object storage, pattern S3) ===
  MINIO_ENDPOINT: "rustfs-composables-svc:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_BUCKET: "composable-agents"
  MINIO_SECURE: "false"
  # === Tracing ===
  ENABLED: "true"
  PROVIDER: "phoenix" # or "langfuse" or "none"
  PROJECT_NAME: "composable-agents"
  PHOENIX_COLLECTOR_ENDPOINT: "https://phoenix.soludev.tech"
  # === MCP ===
  MCP_TOOL_TIMEOUT: "600"
  AGENT_STREAM_IDLE_TIMEOUT: "600"
  # === Chat attachments limits (bytes unless stated otherwise) ===
  CHAT_ATTACHMENT_MAX_COUNT: "10"
  CHAT_ATTACHMENT_MAX_TOTAL_BYTES: "52428800"
  CHAT_ATTACHMENT_MAX_IMAGE_BYTES: "10485760"
  CHAT_ATTACHMENT_MAX_DOCUMENT_BYTES: "52428800"
  # Max Markdown chars accepted by the create_pdf tool (chars, not bytes)
  CREATE_PDF_MAX_MARKDOWN_CHARS: "1000000"
  # === Dual auth (JWT via Logto OIDC + per-user API keys) ===
  LOGTO_URL: "https://logto.soludev.tech"
  JWT_AUDIENCE: "trangw5kf2ii6tcmcdzzy"
  # Multi-audience JWT (REQ-003/REQ-008, comma-separated — NEVER JSON):
  # - trangw5kf2ii6tcmcdzzy = Logto app-id of Bricks OAuth2 Proxy (the UI
  #   cookie-session ID tokens injected by forwardAuth)
  # - https://composables-agent.soludev.tech/mcp = registered API resource
  #   (the MCP door; matches the advertised resource EXACTLY — no trailing
  #   slash: OpenCode sends the URL as advertised)
  # - o2dldt3qfogy2okntx4yb = Logto app-id of the "OpenCode" Native app
  #   (REQ-009, redirect http://127.0.0.1:19876/callback)
  JWT_AUDIENCES: "trangw5kf2ii6tcmcdzzy,https://composables-agent.soludev.tech/mcp,o2dldt3qfogy2okntx4yb"
  # === MCP OAuth2 discovery (REQ-002/REQ-013) ===
  # Host allow-list for the MCP transport security (comma-separated).
  MCP_ALLOWED_HOSTS: "composables-agent.soludev.tech,127.0.0.1:*,localhost:*,[::1]:*"
  # Public base URL used to derive the advertised `resource` when the Host
  # header is not trustworthily derivable.
  MCP_PUBLIC_BASE_URL: "https://composables-agent.soludev.tech"
  # The PUBLICLY reachable authorization server advertised by the discovery
  # document (decoupled from LOGTO_URL, which stays the container-side JWKS base).
  MCP_AUTHORIZATION_SERVER: "https://logto.soludev.tech/oidc"