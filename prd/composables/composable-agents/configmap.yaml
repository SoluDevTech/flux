apiVersion: v1
kind: ConfigMap
metadata:
  name: composable-agents-config
  namespace: composables
data:
  # === OpenAI-compatible endpoint (OpenRouter, LiteLLM, etc.) ===
  OPENAI_BASE_URL: "https://openrouter.ai/api/v1"
  # === Agent configuration ===
  AGENTS_DIR: "./agents"
  HOST: "0.0.0.0"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  ALLOWED_ORIGINS: '["https://composables.soludev.tech"]'
  # === RustFS (object storage, pattern S3) ===
  MINIO_ENDPOINT: "rustfs-composables-svc:9000"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_BUCKET: "composable-agents"
  MINIO_SECURE: "false"
  # === Tracing ===
  ENABLED: "true"
  PROVIDER: "phoenix" # or "langfuse" or "none"
  PROJECT_NAME: "composable-agents"
  PHOENIX_COLLECTOR_ENDPOINT: "https://phoenix.soludev.tech"
  # === MCP ===
  MCP_TOOL_TIMEOUT: "600"
  AGENT_STREAM_IDLE_TIMEOUT: "600"
  # === Chat attachments limits (bytes unless stated otherwise) ===
  CHAT_ATTACHMENT_MAX_COUNT: "10"
  CHAT_ATTACHMENT_MAX_TOTAL_BYTES: "52428800"
  CHAT_ATTACHMENT_MAX_IMAGE_BYTES: "10485760"
  CHAT_ATTACHMENT_MAX_DOCUMENT_BYTES: "52428800"
  # Max Markdown chars accepted by the create_pdf tool (chars, not bytes)
  CREATE_PDF_MAX_MARKDOWN_CHARS: "1000000"
  # === Dual auth (JWT via Logto OIDC + per-user API keys) ===
  LOGTO_URL: "https://logto.soludev.tech"
  JWT_AUDIENCE: "trangw5kf2ii6tcmcdzzy"