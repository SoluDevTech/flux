# RustFS Composables — identifiants root (creds dédiés composables-rustfs)
# OpenBao path: composables/rustfs (clés RUSTFS_ACCESS / RUSTFS_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-external-secret
  namespace: composables
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-composables
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: composables/rustfs