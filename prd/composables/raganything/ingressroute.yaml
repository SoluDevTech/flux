apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: raganything-ingress
  namespace: composables
spec:
  entryPoints:
    - web
    - websecure
  routes:
    # Machine-to-machine calls with X-API-Key bypass forwardAuth and go
    # directly to the backend (the backend validates the per-user API key
    # itself). Higher priority than the catch-all forwardAuth route.
    - match: Host(`raganything.soludev.tech`) && HeaderRegexp(`X-API-Key`, `.+`)
      kind: Rule
      priority: 100
      services:
        - name: raganything
          port: 8000
    # Browser calls (cookie session) and direct Bearer JWT calls go through
    # forwardAuth (oauth2-proxy validates the cookie/JWT and injects the
    # Authorization header) + CORS.
    - match: Host(`raganything.soludev.tech`)
      kind: Rule
      priority: 1
      middlewares:
        - name: traefik-forward-auth
          namespace: composables
        - name: cors-middleware
          namespace: composables
      services:
        - name: raganything
          port: 8000