apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: soludev
  labels:
    app: pgbouncer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
        app.kubernetes.io/part-of: soludev-workload
    spec:
      volumes:
        - name: config
          configMap:
            name: pgbouncer-configmap
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:v1.25.2-p0
          # L'entrypoint edoburu parse DATABASE_URL et genere le userlist
          # (generate_userlist_if_needed) ; le configmap fournit le ini.
          env:
            - name: DATABASE_URLS
              valueFrom:
                secretKeyRef:
                  name: pgbouncer
                  key: DATABASE_URLS
          ports:
            - containerPort: 6432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
