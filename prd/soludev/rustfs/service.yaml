# RustFS Soludev (observabilité)
apiVersion: v1
kind: Service
metadata:
  name: rustfs-soludev
  namespace: soludev
  labels:
    app: rustfs
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
    - name: http
      port: 9000
      targetPort: 9000
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: rustfs-soludev-console
  namespace: soludev
  labels:
    app: rustfs
spec:
  type: ClusterIP
  selector:
    app: rustfs
  ports:
    - name: http-console
      port: 9001
      targetPort: 9001
      protocol: TCP