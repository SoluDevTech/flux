# RustFS Soludev — identifiants root (creds dédiés soludev-rustfs, pas minioadmin)
# OpenBao path: soludev/rustfs (clés RUSTFS_ACCESS / RUSTFS_SECRET)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-external-secret
  namespace: soludev
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: rustfs-soludev
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: soludev/rustfs