# RustFS Soludev (observabilité) — remplace minio-soludev (helm)
# Data: PV local /srv/nfs/soludev/rustfs (PVC rustfs-soludev)
# Secret: rustfs-soludev — ExternalSecret, OpenBao path soludev/rustfs
#        (clés RUSTFS_ACCESS / RUSTFS_SECRET, creds dédiés soludev-rustfs)
# Image pinned 1.0.1 (jamais latest)
# UID 10001 (user rustfs officiel) -> le dir du PV doit appartenir à 10001:10001
# Santé: endpoint S3 /health (pas /minio/health — c'est MinIO)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rustfs-soludev
  namespace: soludev
  labels:
    app: rustfs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rustfs
  template:
    metadata:
      labels:
        app: rustfs
        app.kubernetes.io/part-of: soludev-workload
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      nodeSelector:
        storage/nodename: storage10
      tolerations:
        - key: storage/role
          operator: Equal
          value: data
          effect: NoSchedule
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rustfs-soludev
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.1
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-soludev
                  key: RUSTFS_ACCESS
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-soludev
                  key: RUSTFS_SECRET
            - name: RUSTFS_ADDRESS
              value: "0.0.0.0:9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: "0.0.0.0:9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9001
              name: http-console
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10