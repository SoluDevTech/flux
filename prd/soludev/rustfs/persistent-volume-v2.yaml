# RustFS Soludev (observabilite) v2 — storage30-c
# Data: /srv/nfs/soludev/rustfs (node vmi3794484, 100.64.0.11, Storage VPS 30)
# Migration nov 2026 : quitte storage10 pour storage30-c (bucket observability,
# backend S3 d'openobserve). La v1 (local-soludev-rustfs, storage10) reste en
# Retain pour rollback.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-soludev-rustfs-v2
spec:
  capacity:
    storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-soludev-rustfs-v2
  local:
    path: /srv/nfs/soludev/rustfs
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage/nodename
              operator: In
              values:
                - storage30-c
