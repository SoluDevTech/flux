apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kagent-ollama-external-secret
  namespace: kagent
spec:
  refreshInterval: 60s
  secretStoreRef:
    name: openbao-backend
    kind: ClusterSecretStore
  target:
    name: kagent-openai
    creationPolicy: Owner
  data:
  - secretKey: OPENAI_API_KEY
    remoteRef:
      key: kv/data/ollama
