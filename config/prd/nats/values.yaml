# Chart: nats
# Repo: https://nats-io.github.io/k8s/helm/charts/
# Install: helm upgrade --install nats nats/nats --version 2.14.6 --namespace soludev -f config/prd/nats/values.yaml
# (TOUJOURS pinner --version 2.14.6 : le repo nats publie les 2.15.x, qui ont
# 11 breaking changes non planifiées — un upgrade sans --version a déployé la
# 2.15.0 le 27 nov 2026, corrigé dans la foulée.)
# Chart 2.14.6 (latest 2.14 line) + server image pinned to 2.14.9-alpine:
# 2.14.9 is the security backport release (GHSA-8xmc-886f-g496 critical MQTT
# OCSP, GHSA-724w-jvcm-4c58 / GHSA-65q4-982r-rm5c / GHSA-gc58-jp35-x246 /
# GHSA-5v9x-4f9q-q7qj high, CVE-2026-111943 Go mitigation) — the chart repo
# does not publish a 2.14.9 chart, hence the image override.
# 2.15.x (11 breaking changes + upgrade guide) to be planned separately.

config:
  merge:
    max_payload: 15728640
    authorization:
      user: "pickpro"
      password: << $NATS_PASSWORD >>
  jetstream:
    enabled: true
    fileStore:
      pvc:
        size: 20Gi
        storageClassName: local-soludev-nats

# Node dédié Storage10 (tainté storage/role=data) — PV local
# /srv/nfs/soludev/nats géré par Flux (prd/soludev/nats/persistent-volume.yaml).
# Migration du local-path worker (nov 2026) : node pincé + disque déterministe.
# NB: le chart merge au niveau PodTemplate (metadata+spec) -> nodeSelector et
# tolerations vivent SOUS merge.spec (un merge à plat serait ignoré par l'API).
podTemplate:
  merge:
    spec:
      nodeSelector:
        storage/nodename: storage10
      tolerations:
        - key: storage/role
          operator: Equal
          value: data
          effect: NoSchedule

container:
  image:
    tag: "2.14.9-alpine"
  env:
    NATS_PASSWORD:
      valueFrom:
        secretKeyRef:
          name: nats-auth
          key: PASSWORD
  merge:
    resources:
      # Node storage10 dédié (2 vCPU / 4 GB, budget 80/20)
      requests:
        cpu: "100m"
        memory: 256Mi
      limits:
        cpu: "1000m"
        memory: 2Gi

service:
  merge:
    spec:
      ports:
        - name: nats
          port: 4222
          targetPort: nats
          protocol: TCP
        - name: monitor
          port: 8222
          targetPort: monitor
          protocol: TCP
# nats-box : grep ressources (popeye POP-106 19 sept)
natsBox:
  container:
    resources:
      requests:
        memory: "32Mi"
        cpu: "10m"
      limits:
        memory: "64Mi"
        cpu: "100m"
