config:
  existingSecret: "oauth2-proxy-secret"
  existingConfig: "oauth2-proxy-config"
  cookieName: "oauth2-proxy-composables"

alphaConfig:
  enabled: true
  existingConfig: "oauth2-proxy-alpha-config"

ingress:
  enabled: false

# Parité pickpro : même image épinglée, sessions en Redis (valkey dédié
# composables : valkey.composables.svc.cluster.local:6379 — pattern déjà
# validé pickpro + pickpro-dev), 256Mi de limit (sessions Redis + SSE).
image:
  repository: "oauth2-proxy/oauth2-proxy"
  tag: "v7.15.6"

sessionStorage:
  type: redis
  redis:
    clientType: standalone
    standalone:
      connectionUrl: redis://valkey.composables.svc.cluster.local:6379

resources:
  requests:
    cpu: "200m"
    memory: "64Mi"
  limits:
    cpu: "1000m"
    memory: "256Mi"

service:
  type: ClusterIP
  portNumber: 4180