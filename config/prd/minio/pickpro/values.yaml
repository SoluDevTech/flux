# minio-values.yaml
# Namespace configuration
namespaceOverride: pickpro

mode: standalone
replicas: 1

rootUser: minioadmin
rootPassword: minioadmin

# Image alignée sur les données existantes (containers docker minio:latest =
# RELEASE.2025-09-07T16-13-09Z) — une version plus ancienne refuse le XL-meta v3
image:
  tag: RELEASE.2025-09-07T16-13-09Z

# Stockage
persistence:
  enabled: true
  existingClaim: minio-pickpro
  storageClass: local-pickpro-minio
  accessMode: ReadWriteOnce
  size: 5Gi

# Ressources
resources:
  requests:
    memory: 512Mi
    cpu: 250m

# Pin: données sur Storage30 (disque local pickpro/minio) + tolérance du taint storage
nodeSelector:
  storage/nodename: storage30
tolerations:
  - key: storage/role
    operator: Equal
    value: data
    effect: NoSchedule

# Container en root comme l'ancien conteneur docker (minio/latest run as root) :
# évite le chown récursif du volume local + bugs de permissions sur .minio.sys/pool.bin
securityContext:
  enabled: true
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  fsGroupChangePolicy: OnRootMismatch

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Créer automatiquement le bucket CVs
buckets:
  - name: cvs
    policy: none