# minio-values.yaml
# Namespace configuration
namespaceOverride: soludev

mode: standalone
replicas: 1

rootUser: minioadmin
rootPassword: minioadmin

# Stockage
persistence:
  enabled: true
  existingClaim: minio-soludev
  storageClass: local-soludev-minio
  accessMode: ReadWriteOnce
  size: 5Gi

# Ressources
resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 250m

# Pin: données sur Storage10 (disque local soludev/minio) + tolérance du taint storage
nodeSelector:
  storage/nodename: storage10
tolerations:
  - key: storage/role
    operator: Equal
    value: data
    effect: NoSchedule

# Container en root comme l'ancien conteneur docker (quay/minio RELEASE.2024-12-18) :
# évite le chown récursif des ~2M fichiers du bucket openobserve
securityContext:
  enabled: true
  runAsUser: 0
  runAsGroup: 0
  fsGroup: 0
  fsGroupChangePolicy: OnRootMismatch

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Créer automatiquement le bucket observability
buckets:
  - name: observability
    policy: none
