# minio-values.yaml
# Namespace configuration
namespaceOverride: soludev

mode: standalone
replicas: 1

rootUser: minioadmin
rootPassword: minioadmin

# Stockage
persistence:
  enabled: true
  existingClaim: minio
  storageClass: nfs-soludev-minio
  accessMode: ReadWriteMany
  size: 5Gi

# Ressources
resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 1Gi
    cpu: 250m

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Créer automatiquement le bucket observability
buckets:
  - name: observability
    policy: none
