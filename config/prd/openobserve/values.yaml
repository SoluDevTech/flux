# OpenObserve — values (helm manuel : helm upgrade --install openobserve openobserve/openobserve-standalone -n soludev -f config/prd/openobserve/values.yaml)
# Snapshot de `helm get values openobserve -n soludev` pour que les upgrades suivants ne régressent pas,
# avec 2 flips de la migration MinIO -> RustFS :
#   ZO_S3_SERVER_URL : minio-soludev -> rustfs-soludev-svc (chart officiel rustfs)
#   ZO_S3_PROVIDER   : minio -> s3 (doc officielle OpenObserve : RustFS passe par le provider s3, path-style par défaut)
# Les autres clés sont UNCHANGED (bucket observability, us-east-1, path-style).
# Creds : ZO_S3_ACCESS/SECRET prennent désormais les clés RUSTFS_ACCESS/RUSTFS_SECRET
# du secret rustfs-soludev (OpenBao soludev/rustfs — creds dédiés, plus de MINIO_*).

auth:
  ZO_S3_ACCESS_KEY: ""
  ZO_S3_SECRET_KEY: ""
  existingRootUserSecret:
    emailKey: ZO_ROOT_USER_EMAIL
    name: soludev-openobserve-secret
    passwordKey: ZO_ROOT_USER_PASSWORD
config: {}
extraEnv:
- name: ZO_S3_ACCESS_KEY
  valueFrom:
    secretKeyRef:
      key: RUSTFS_ACCESS
      name: rustfs-soludev
- name: ZO_S3_SECRET_KEY
  valueFrom:
    secretKeyRef:
      key: RUSTFS_SECRET
      name: rustfs-soludev
- name: ZO_META_POSTGRES_DSN
  valueFrom:
    secretKeyRef:
      key: ZO_META_POSTGRES_DSN
      name: soludev-openobserve-secret
- name: RUST_BACKTRACE
  value: full
- name: ZO_META_STORE
  value: postgres
- name: ZO_META_CONNECTION_POOL_MIN_SIZE
  value: "1"
- name: ZO_META_CONNECTION_POOL_MAX_SIZE
  value: "5"
- name: ZO_LOCAL_MODE
  value: "true"
- name: ZO_LOCAL_MODE_STORAGE
  value: s3
- name: ZO_S3_PROVIDER
  value: s3
- name: ZO_S3_SERVER_URL
  value: http://rustfs-soludev-svc.soludev.svc.cluster.local:9000
- name: ZO_S3_REGION_NAME
  value: us-east-1
- name: ZO_S3_BUCKET_NAME
  value: observability
- name: ZO_S3_BUCKET_PREFIX
  value: ""
- name: ZO_S3_FEATURE_FORCE_HOSTED_STYLE
  value: "false"
- name: ZO_S3_FEATURE_FORCE_PATH_STYLE
  value: "true"
- name: ZO_S3_FEATURE_HTTP1_ONLY
  value: "false"
- name: ZO_S3_FEATURE_HTTP2_ONLY
  value: "false"
- name: ZO_S3_CONNECT_TIMEOUT
  value: "30"
- name: ZO_S3_REQUEST_TIMEOUT
  value: "3600"
- name: ZO_COMPACT_DATA_RETENTION_DAYS
  value: "10"
- name: ZO_COMPACT_ENABLED
  value: "true"
- name: ZO_COMPACT_INTERVAL
  value: "3600"
- name: ZO_FILE_PUSH_INTERVAL
  value: "10"
- name: ZO_MAX_FILE_RETENTION_TIME
  value: "60"
- name: ZO_MEM_PERSIST_INTERVAL
  value: "1"
- name: ZO_MEMORY_CACHE_ENABLED
  value: "true"
- name: ZO_MEMORY_CACHE_MAX_SIZE
  value: "512"
- name: ZO_DISK_CACHE_ENABLED
  value: "true"
- name: ZO_DISK_CACHE_MAX_SIZE
  value: "2000"
- name: ZO_DISK_CACHE_GC_INTERVAL
  value: "30"
- name: ZO_DISK_CACHE_GC_SIZE
  value: "500"
- name: ZO_DISK_CACHE_STRATEGY
  value: time_lru
- name: ZO_RESULT_CACHE_ENABLED
  value: "true"
- name: ZO_MAX_DASHBOARD_SERIES
  value: "500"
image:
  oss:
    tag: v1.0.4
ingress:
  enabled: false
livenessProbe:
  failureThreshold: 6
  initialDelaySeconds: 60
  periodSeconds: 15
  successThreshold: 1
  timeoutSeconds: 5
minio:
  enabled: false
persistence:
  enabled: false
readinessProbe:
  failureThreshold: 6
  initialDelaySeconds: 60
  periodSeconds: 15
  successThreshold: 1
  timeoutSeconds: 5
resources:
  limits:
    cpu: 1500m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 2Gi
securityContext: {}
service:
  grpc_port: 5081
  http_port: 5080
  type: ClusterIP
startupProbe:
  failureThreshold: 30
  initialDelaySeconds: 30
  periodSeconds: 10
  successThreshold: 1
  timeoutSeconds: 5
