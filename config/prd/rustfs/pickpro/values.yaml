# RustFS PickPro PROD (pickpro) — helm manuel
# Install : helm upgrade --install rustfs-pickpro rustfs/rustfs --version 1.0.6 -n pickpro -f config/prd/rustfs/pickpro/values.yaml
# (pinner --version : le repo rustfs peut publier des versions majeures)
# Migration nov 2026 vers storage30-b (Storage VPS 30 dedie, 1 TB) :
# buckets cvs / photos / transcripts transferes via mc mirror, release name
# inchange -> service rustfs-pickpro-svc:9000 + configmaps MINIO_HOST intacts.
# PV/PVC + secret gérés par Flux dans prd/pickpro/rustfs/ :
#   - PVC rustfs-pickpro-v2 (PV local /srv/nfs/pickpro/rustfs sur storage30-b)
#   - secret rustfs-pickpro (ExternalSecret, OpenBao path pickpro/rustfs)
# Chart officiel : https://charts.rustfs.com (chart rustfs, version 1.0.6)
fullnameOverride: rustfs-pickpro

mode:
  standalone:
    enabled: true
    existingClaim:
      dataClaim: rustfs-pickpro-v2
  distributed:
    enabled: false

replicaCount: 1
drivesPerNode: 1

image:
  rustfs:
    tag: "1.0.6"

# Creds : le secret (Flux) est injecté en envFrom — ses clés RUSTFS_ACCESS/RUSTFS_SECRET
# (noms OpenBao choisis) ne sont pas lues par le binaire, qui attend RUSTFS_ACCESS_KEY /
# RUSTFS_SECRET_KEY : extraEnv fait le pont à partir des mêmes clés.
secret:
  existingSecret: rustfs-pickpro
extraEnv:
  - name: RUSTFS_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-pickpro
        key: RUSTFS_ACCESS
  - name: RUSTFS_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-pickpro
        key: RUSTFS_SECRET

config:
  rustfs:
    address: ":9000"
    console_enable: "true"
    console_address: ":9001"
    region: "us-east-1"
    # Node storage30 = 8GB RAM partagés : scanner lent pour limiter le churn
    # CPU/mémoire de fond (heal/capacity scan sur ~20k fichiers)
    scanner:
      speed: "slow"

service:
  type: ClusterIP
  endpoint:
    port: 9000
  console:
    port: 9001

ingress:
  enabled: false

nodeSelector:
  storage/nodename: storage30-b
tolerations:
  - key: storage/role
    operator: Equal
    value: data
    effect: NoSchedule

affinity:
  podAntiAffinity:
    enabled: false

resources:
  # Node storage30-b dédié (6 vCPU / 18 GB, budget 80/20)
  requests:
    memory: "1Gi"
    cpu: "250m"
  limits:
    memory: "8Gi"
    cpu: "4000m"