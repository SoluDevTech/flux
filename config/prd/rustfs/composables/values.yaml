# RustFS Composables — helm manuel
# Install : helm upgrade --install rustfs-composables rustfs/rustfs -n composables -f config/prd/rustfs/composables/values.yaml
# Remplace minio-composables (deployment, manifest prd/composables/minio/ supprimé en 22e3a85).
# Données migrées via mc mirror (buckets composable-agents / raganything),
# voir ARCHITECTURE.md. PV/PVC + secret gérés par Flux dans prd/composables/rustfs/ :
#   - PVC rustfs-composables (PV local /srv/nfs/composables/rustfs sur storage30)
#   - secret rustfs-composables (ExternalSecret, OpenBao path composables/rustfs)
# Chart officiel : https://charts.rustfs.com (chart rustfs, version 1.0.1)
fullnameOverride: rustfs-composables

mode:
  standalone:
    enabled: true
    existingClaim:
      dataClaim: rustfs-composables
  distributed:
    enabled: false

replicaCount: 1
drivesPerNode: 1

image:
  rustfs:
    tag: "1.0.1"

# Creds : le secret (Flux) est injecté en envFrom — ses clés RUSTFS_ACCESS/RUSTFS_SECRET
# (noms OpenBao choisis) ne sont pas lues par le binaire, qui attend RUSTFS_ACCESS_KEY /
# RUSTFS_SECRET_KEY : extraEnv fait le pont à partir des mêmes clés.
secret:
  existingSecret: rustfs-composables
extraEnv:
  - name: RUSTFS_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-composables
        key: RUSTFS_ACCESS
  - name: RUSTFS_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: rustfs-composables
        key: RUSTFS_SECRET

service:
  type: ClusterIP
  endpoint:
    port: 9000
  console:
    port: 9001

ingress:
  enabled: false

config:
  rustfs:
    address: ":9000"
    console_enable: "true"
    console_address: ":9001"
    region: "us-east-1"
    # Node storage30 = 8GB RAM partagés (rustfs-pickpro + rustfs-pickpro-dev sur
    # le même nœud) : scanner lent pour limiter le churn CPU/mémoire de fond
    scanner:
      speed: "slow"

# Probes tolérantes : le disque du VPS peut stall 30s+ sous contention
# (même fix que rustfs-soludev / rustfs-pickpro). Défaut chart (period 5s,
# timeout 3s, 3 échecs) tue le pod au premier stall.
livenessProbe:
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5
readinessProbe:
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 5

nodeSelector:
  storage/nodename: storage30
tolerations:
  - key: storage/role
    operator: Equal
    value: data
    effect: NoSchedule

affinity:
  podAntiAffinity:
    enabled: false

resources:
  requests:
    memory: "512Mi"
    cpu: "100m"
  limits:
    memory: "1Gi"
    cpu: "500m"